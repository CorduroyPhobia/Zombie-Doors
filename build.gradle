plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

def generatedIdentity = layout.buildDirectory.dir('generated/sources/identity/java')
sourceSets.main.java.srcDir generatedIdentity

loom {
    splitEnvironmentSourceSets()
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${project.mod_id}-thumbnail"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

configurations { clientImplementation.extendsFrom implementation }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    clientImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.register('generateProjectIdentity') {
    def identity = [modName: project.mod_name, modId: project.mod_id]
    inputs.properties(identity)
    outputs.dir(generatedIdentity)
    doLast {
        def output = generatedIdentity.get().file(
            "${project.maven_group.replace('.', '/')}/generated/ProjectIdentity.java").asFile
        output.parentFile.mkdirs()
        output.text = """package ${project.maven_group}.generated;
public final class ProjectIdentity {
    public static final String MOD_NAME = "${identity.modName}";
    public static final String MOD_ID = "${identity.modId}";
    private ProjectIdentity() {}
}
"""
    }
}
tasks.named('compileJava') { dependsOn tasks.named('generateProjectIdentity') }

def metadata = ['mod_id', 'mod_name', 'mod_description', 'mod_authors', 'license_id',
    'minecraft_version', 'loader_version', 'fabric_api_version', 'cloth_config_version',
    'modmenu_version', 'maven_group'].collectEntries { [(it): project.property(it)] }
metadata.version = project.mod_version
tasks.named('processResources') {
    inputs.properties(metadata)
    filesMatching('fabric.mod.json') { expand metadata }
}
tasks.named('processGametestResources') {
    inputs.properties(metadata)
    filesMatching('fabric.mod.json') { expand metadata }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.named('sourcesJar') {
    dependsOn tasks.named('generateProjectIdentity')
    from('LICENSE')
}
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }

configurations { thumbnailMods }
dependencies {
    thumbnailMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
tasks.register('thumbnailJar', Jar) {
    archiveClassifier = 'thumbnail'
    destinationDirectory = layout.buildDirectory.dir('thumbnail')
    from sourceSets.gametest.output
}

tasks.register('captureThumbnail', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.setFrom(tasks.named('jar'), tasks.named('thumbnailJar'), configurations.thumbnailMods)
    runDir = layout.buildDirectory.dir('run/thumbnailStudio')
    useXVFB = false
    jvmArgs.addAll('-Xmx2G', '-Dfabric.client.gametest')
    programArgs.addAll('--username', 'DoorStudio', '--accessToken', '0', '--version', project.minecraft_version)
}
